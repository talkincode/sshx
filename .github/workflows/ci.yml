name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.25.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -short -race -coverprofile=coverage.out -covermode=atomic ./...
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Build
        run: go build -v ./cmd/sshx

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"

      - name: Download dependencies
        run: go mod download

      - name: Prepare isolated macOS keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/sshx-e2e.keychain-db"
          keychain_password="sshx-e2e-ci"
          original_keychain="$(security default-keychain -d user | sed 's/^[[:space:]]*\"//; s/\"[[:space:]]*$//')"
          keychain_list_file="$RUNNER_TEMP/sshx-e2e-original-keychains.txt"
          security list-keychains -d user | sed 's/^[[:space:]]*\"//; s/\"[[:space:]]*$//' > "$keychain_list_file"
          original_keychains=()
          while IFS= read -r item; do
            if [ -n "$item" ]; then original_keychains+=("$item"); fi
          done < "$keychain_list_file"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          security default-keychain -d user -s "$keychain_path"
          {
            echo "SSHX_E2E_KEYCHAIN=$keychain_path"
            echo "SSHX_E2E_ORIGINAL_KEYCHAIN=$original_keychain"
            echo "SSHX_E2E_ORIGINAL_KEYCHAIN_LIST=$keychain_list_file"
          } >> "$GITHUB_ENV"

      - name: Run compiled-binary E2E tests
        env:
          SSHX_E2E_REAL_KEYRING: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: go test -v ./tests/e2e

      - name: Remove isolated macOS keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${SSHX_E2E_ORIGINAL_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$SSHX_E2E_ORIGINAL_KEYCHAIN"
          fi
          if [ -f "${SSHX_E2E_ORIGINAL_KEYCHAIN_LIST:-}" ]; then
            original_keychains=()
            while IFS= read -r item; do
              if [ -n "$item" ]; then original_keychains+=("$item"); fi
            done < "$SSHX_E2E_ORIGINAL_KEYCHAIN_LIST"
            if [ ${#original_keychains[@]} -gt 0 ]; then
              security list-keychains -d user -s "${original_keychains[@]}"
            fi
            rm -f "$SSHX_E2E_ORIGINAL_KEYCHAIN_LIST"
          fi
          if [ -n "${SSHX_E2E_KEYCHAIN:-}" ]; then
            security delete-keychain "$SSHX_E2E_KEYCHAIN" || true
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"

      - name: Run Go vulnerability scanner
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.10"
          go-package: ./...
          repo-checkout: false

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."

      - name: Fix SARIF file format
        if: always()
        run: |
          if [ -f results.sarif ]; then
            # Ensure we have write permissions
            chmod +w results.sarif || true

            # Fix SARIF format using Python
            python3 << 'EOF'
          import json
          import sys

          try:
              with open('results.sarif', 'r') as f:
                  data = json.load(f)

              # Fix artifactChanges to be arrays
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      for fix in result.get('fixes', []):
                          if 'artifactChanges' in fix:
                              # If artifactChanges is not a list, wrap it in a list
                              if not isinstance(fix['artifactChanges'], list):
                                  fix['artifactChanges'] = [fix['artifactChanges']]

              with open('results.sarif', 'w') as f:
                  json.dump(data, f, indent=2)

              print("✓ SARIF file format fixed successfully")
          except Exception as e:
              print(f"Warning: Failed to fix SARIF format: {e}", file=sys.stderr)
              sys.exit(0)  # Don't fail the workflow
          EOF
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true
