name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.25.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -short -race -coverprofile=coverage.out -covermode=atomic ./...
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Build
        run: go build -v ./cmd/sshx

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (all portable packages)
        # POSIX shell/mode fixtures skip only their unsupported capability.
        # Plugin/skill lifecycle, JSON fixtures, drive/UNC/junction confinement,
        # and read-only replacement recovery run natively on Windows.
        run: go test -v -short ./cmd/... ./internal/... ./pkg/...

      - name: Run compiled Windows CLI contract and reliability tests
        # The loopback commands in this subset do not execute local POSIX
        # scripts. This is native CLI evidence, not a cross-compile check.
        # Credential Manager is not exercised without an ephemeral OS profile.
        env:
          SSHX_E2E_REAL_KEYRING: "0"
        run: go test -v -count=1 ./tests/e2e -run 'Test(Portable|Reliability|ContractGolden|IsolatedEnvironment|CLICommand|CLIKeyAuthentication|CLIProcess|CLIFailures|CLIPermissions|CLISafety|CLIDryRun|CLISkill)'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./cmd/sshx

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Download dependencies
        run: go mod download

      - name: Prepare isolated macOS keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.e2e-keychain"
          keychain_path="$GITHUB_WORKSPACE/.e2e-keychain/sshx-e2e.keychain-db"
          keychain_password="sshx-e2e-ci"
          original_keychain="$(security default-keychain -d user | sed 's/^[[:space:]]*\"//; s/\"[[:space:]]*$//')"
          keychain_list_file="$GITHUB_WORKSPACE/.e2e-keychain/original-keychains.txt"
          security list-keychains -d user | sed 's/^[[:space:]]*\"//; s/\"[[:space:]]*$//' > "$keychain_list_file"
          {
            echo "SSHX_E2E_KEYCHAIN=$keychain_path"
            echo "SSHX_E2E_ORIGINAL_KEYCHAIN=$original_keychain"
            echo "SSHX_E2E_ORIGINAL_KEYCHAIN_LIST=$keychain_list_file"
          } >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      - name: Run compiled-binary E2E tests
        env:
          SSHX_E2E_REAL_KEYRING: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: go test -v -count=1 ./tests/e2e

      - name: Remove isolated macOS keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${SSHX_E2E_ORIGINAL_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$SSHX_E2E_ORIGINAL_KEYCHAIN"
          fi
          if [ -f "${SSHX_E2E_ORIGINAL_KEYCHAIN_LIST:-}" ]; then
            original_keychains=()
            while IFS= read -r item; do
              if [ -n "$item" ]; then original_keychains+=("$item"); fi
            done < "$SSHX_E2E_ORIGINAL_KEYCHAIN_LIST"
            if [ ${#original_keychains[@]} -gt 0 ]; then
              security list-keychains -d user -s "${original_keychains[@]}"
            fi
            rm -f "$SSHX_E2E_ORIGINAL_KEYCHAIN_LIST"
          fi
          if [ -n "${SSHX_E2E_KEYCHAIN:-}" ]; then
            security delete-keychain "$SSHX_E2E_KEYCHAIN" || true
          fi

  sql-native:
    name: SQL (native PostgreSQL and MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sshx
          POSTGRES_PASSWORD: sshx-postgres-ci
          POSTGRES_DB: sshx_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sshx -d sshx_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sshx-mysql-ci
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sshx_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psshx-mysql-ci"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Verify native SQL prerequisites
        # ubuntu-latest includes native clients. Missing prerequisites must fail
        # this lane, not silently turn it into fake-MySQL or skipped evidence.
        run: |
          command -v sh
          psql --version
          mysql --version
          sqlite3 --version

      - name: Run real database compiled-CLI reliability tests
        env:
          SSHX_E2E_REAL_SQL: "1"
          SSHX_E2E_PG_PASSWORD: sshx-postgres-ci
          SSHX_E2E_MYSQL_PASSWORD: sshx-mysql-ci
        run: go test -v ./tests/e2e -run '^TestSQLRealEngineReliability$' -count=1

      - name: Verify PostgreSQL transactions and SQLite concurrent writers
        env:
          SSHX_SQL_INTEGRATION_POSTGRES: "1"
          SSHX_SQL_INTEGRATION_DATABASE: sshx_e2e
          SSHX_SQL_INTEGRATION_USER: sshx
          SSHX_SQL_INTEGRATION_HOST: 127.0.0.1
          SSHX_SQL_INTEGRATION_PORT: "5432"
          SSHX_SQL_INTEGRATION_PASSWORD: sshx-postgres-ci
        run: go test -v ./internal/sqlsafe -run 'TestSQLRealEngine(RollbackAndCommit|ConcurrentWriterExcludedFromPreimage)/(postgres|sqlite)$' -count=1

      - name: Verify MySQL rollback and concurrent writers
        env:
          SSHX_SQL_INTEGRATION_MYSQL: "1"
          SSHX_SQL_INTEGRATION_DATABASE: sshx_e2e
          SSHX_SQL_INTEGRATION_USER: root
          SSHX_SQL_INTEGRATION_HOST: 127.0.0.1
          SSHX_SQL_INTEGRATION_PORT: "3306"
          SSHX_SQL_INTEGRATION_PASSWORD: sshx-mysql-ci
        run: go test -v ./internal/sqlsafe -run 'TestSQLRealEngine(RollbackAndCommit|ConcurrentWriterExcludedFromPreimage)/mysql$' -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Run Go vulnerability scanner
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.13"
          go-package: ./...
          repo-checkout: false

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."

      - name: Fix SARIF file format
        if: always()
        run: |
          if [ -f results.sarif ]; then
            # Ensure we have write permissions
            chmod +w results.sarif || true

            # Fix SARIF format using Python
            python3 << 'EOF'
          import json
          import sys

          try:
              with open('results.sarif', 'r') as f:
                  data = json.load(f)

              # Fix artifactChanges to be arrays
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      for fix in result.get('fixes', []):
                          if 'artifactChanges' in fix:
                              # If artifactChanges is not a list, wrap it in a list
                              if not isinstance(fix['artifactChanges'], list):
                                  fix['artifactChanges'] = [fix['artifactChanges']]

              with open('results.sarif', 'w') as f:
                  json.dump(data, f, indent=2)

              print("✓ SARIF file format fixed successfully")
          except Exception as e:
              print(f"Warning: Failed to fix SARIF format: {e}", file=sys.stderr)
              sys.exit(0)  # Don't fail the workflow
          EOF
          fi

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true
